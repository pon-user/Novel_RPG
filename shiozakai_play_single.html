.battle-header{display:grid;grid-template-columns:1fr 1fr;gap:16px}.enemy-preview{display:grid;gap:9px;padding:16px;max-height:275px;overflow:auto}.enemy-mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid #ffffff19}.enemy-mini strong{font-size:12px}.enemy-mini small{color:#a9bcc7}.round-tabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 14px;padding-bottom:3px}.round-tab{background:#213145;color:#b6c6d0;border:1px solid #55697b;padding:13px 17px;border-radius:9px;flex:1;white-space:nowrap;min-width:64px}.round-tab.active{border-color:var(--gold);background:#3c3940;color:#efd5af}.plan-grid{display:grid;gap:11px}.plan-row{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(125px,.6fr);align-items:center;gap:12px;padding:12px 15px;border:1px solid #4c627693;border-radius:12px;background:#1c2e4090}.plan-character{display:flex;align-items:center;gap:10px}.plan-character .token{width:37px;height:37px;border-radius:9px;display:grid;place-items:center;background:#344659;border:1px solid #7384965e;color:var(--gold);font-size:17px}.plan-character span{font-size:11px;color:var(--muted)}.plan-character strong{display:block;font-size:13px;margin-top:3px}.skill-description{margin-top:9px;color:#9db2c2;font-size:11px;line-height:1.7}.battle-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:21px}

  <aside class="sidebar">

function isStat(u,kind){return u.statuses.some(s=>s.kind===kind)}
function stats(u,key){
 let x=u.base[key]||0, groups=new Map();
 for(const b of u.buffs){if(!b.stats.includes(key))continue;
  let group=[...b.stats].sort().join('|');let g=groups.get(group)||{plus:0,minus:0};
  // Enemy 10 reverses positive buff values while active.
  const pct=u.reversed&&b.pct>0?-b.pct:b.pct;
  if(pct>=0)g.plus=Math.max(g.plus,pct);else g.minus=Math.min(g.minus,pct);
  groups.set(group,g);

function addBuff(u,attrs,pct,duration,source='',ctx){

  const exception=ctx?.encounterId==='E05'&&u.id==='overlord'&&attrs.every(k=>['patk','matk'].includes(k));
  if(!exception){if(ctx)ctx.say(`${u.name}には弱体化が効かない。`,'status');return false;}
 }
 u.buffs.push({stats:[...attrs],pct,left:duration,source,skipExpireOnce:ctx?.currentActor===u.id});
 if(ctx)ctx.say(`${u.name} ${pct>0?'強化':'弱体化'} ${attrs.join('/')} ${pct>0?'+':''}${Math.round(pct*100)}%`,'status');

function addStatus(u,kind,duration,ctx){

 }

function unit(id,side,gem='balanced',equipment={}){

 const equip=side==='ally'?[equipment.W,equipment.A,equipment.X].filter(Boolean):[];
 for(const eid of equip){const it=D().equipment[eid];if(it)for(const [k,v] of Object.entries(it.stats))base[k]=(base[k]||0)+v}
 base.hp=Math.max(1,base.hp);
 const desc=side==='ally'?D().charactersDraft.find(x=>x.id===id):null;
 return {id:side==='ally'?id:row.id,side,name:side==='ally'?desc?.name||id:row.name,
  base,hp:base.hp,maxhp:base.hp,element:side==='ally'?'neutral':row.element||'neutral',
  buffs:[],statuses:[],shields:[],control:0,toxic_poison:0,cover:null,aoe_cover:null,taunt:0,

function makeParty(ids,gem,equipment){return ids.map(id=>unit(id,'ally',gem,equipment[id]||{}))}
function skillOptions(uid,gem){return D().unlockedSkills[uid+':'+(uid==='H'?gem:'any')].map(sid=>D().skills[sid])}

function targetMode(s){

function validate({encounterId,roster,gem,gear,plan}){

 if(!Array.isArray(roster)||roster.length!==4||roster[0]!=='H'||new Set(roster).size!==4)throw new Error('主人公＋仲間3人を選んでください');
 if(!['balanced','flame','tide'].includes(gem))throw new Error('命珠が不正です');
 if(!Array.isArray(plan)||plan.length!==5)throw new Error('5ラウンド分の行動予約が必要です');
 const enemy=D().encounters.find(e=>e.id===encounterId);
 for(const id of roster){
  const used=new Set();

   const action=row[id];const s=action&&skill(action.skill);
   if(!s||!skillOptions(id,gem).some(x=>x.id===s.id))throw new Error(`第${index+1}R：${id}に未解放の技能があります`);
   if(s.uses===1&&used.has(s.id))throw new Error(`第${index+1}R：${s.label}は1戦で1回しか使えません`);
   if(s.uses===1)used.add(s.id);
   const mode=targetMode(s);
   if(mode==='ally'&&(!roster.includes(action.target)||((s.type==='cover'||s.type==='cover_aoe')&&action.target===id)))throw new Error(`第${index+1}R：${s.label}の対象が不正です`);
   if(mode==='enemy'&&!enemy.enemies.some(e=>e.id===action.target))throw new Error(`第${index+1}R：${s.label}の敵対象が不正です`);
  }
 }

}
function guardRedirect(ctx,target,aoe){
 let recipient=target, guardian=null;
 if(!aoe){
  const taunts=live(ctx.sideOf(target)).filter(u=>u.taunt>0);
  if(taunts.length)recipient=taunts.sort((a,b)=>a.id.localeCompare(b.id))[0];
  const covers=live(ctx.sideOf(target)).filter(u=>u.cover&&u.cover.target===recipient.id&&u.id!==recipient.id);
  if(covers.length){guardian=covers.sort((a,b)=>a.id.localeCompare(b.id))[0];recipient=guardian;ctx.metrics.cover++;}
 }else{
  const guardians=live(ctx.sideOf(target)).filter(u=>u.aoe_cover&&u.aoe_cover.target===recipient.id&&u.id!==recipient.id);
  if(guardians.length){guardian=guardians[0];recipient=guardian;ctx.metrics.aoeCover++;}
 }
 return {recipient,guardian};
}
function damage(ctx,attacker,initialTarget,kind,power,{element='neutral',ignore=0,extra=0,aoe=false,pierce=false,reflect=true,redirect=true}={}){
 if(!initialTarget||initialTarget.hp<=0||attacker.hp<=0)return 0;
 // Guardian/decoy enemy-specific redirects are tested only for single-target hits.
 let target=initialTarget,intercepted=false;
 if(redirect&&attacker.side==='ally'&&!aoe){
  const enemies=live(ctx.enemies);
  const proxy=enemies.find(u=>(u.id==='guard'&&target.id==='toxic')||(u.id==='decoy'&&target.id==='purger'));
  if(proxy)target=proxy;
 }
 if(redirect&&attacker.side==='enemy'){
  const r=guardRedirect(ctx,target,aoe);target=r.recipient;
  intercepted=!!(r.guardian&&target.id!==initialTarget.id&&target.id==='02'&&kind==='physical');
 }
 if(target.immuneKinds.includes(kind)){ctx.say(`${target.name}は${kind==='physical'?'物理':'魔法'}を無効化！`,'immune');return 0;}
 let baseStat=stats(attacker,kind==='physical'?'patk':'matk');
 let defStat=stats(target,kind==='physical'?'pdef':'mdef')*(1-ignore);
 let elementMult=elemChart[element]?.[target.element]||1;
 let vuln=isStat(target,'vulnerable')?1.2:1;
 let raw=Math.max(1,Math.floor(baseStat*(power+extra)/100*100/(100+defStat)*elementMult*vuln+1e-9));
 let residual=raw,shieldTaken=0;
 if(!pierce){for(const sh of target.shields.sort((a,b)=>a.left-b.left)){let absorb=Math.min(residual,sh.value);sh.value-=absorb;residual-=absorb;shieldTaken+=absorb;if(!residual)break}}
 let dealt=Math.min(target.hp,residual);target.hp-=dealt;
 ctx.say(`${attacker.name} → ${target.name}　${nfmt(dealt)}ダメージ${shieldTaken?`（障壁${shieldTaken}吸収）`:''}`,'damage');
 ctx.metrics.damage+=dealt;
 if(intercepted&&target.hp>0&&!ctx.actionCounterTaken.has(target.id)){
  ctx.actionCounterTaken.add(target.id);const retaliate=Math.min(attacker.hp,Math.max(1,Math.floor(stats(attacker,'patk')*power/100*.25)));
  attacker.hp-=retaliate;ctx.metrics.counter++;ctx.say(`${target.name}の守護反撃！　${attacker.name}に${retaliate}`,'counter');
 }
 if(reflect&&attacker.side==='ally'&&target.id==='mirror'&&dealt>0){
  const loss=Math.min(attacker.hp,Math.floor(dealt*.35));attacker.hp-=loss;
  ctx.metrics.reflection+=loss;ctx.say(`鏡の反射が${attacker.name}へ${loss}ダメージ`,'status');

function directTargets(ctx,actor,s,target){

 if(s.scope==='allies')return live(ctx.allies);
 if(s.scope==='enemies')return live(ctx.enemies);
 if(s.scope==='ally')return live(ctx.allies).filter(x=>x.id===target);

}
function playerAction(ctx,actor,action){
 let s=skill(action.skill);if(!s)return;
 if(actor.used.includes(s.id)){ctx.say(`${actor.name}の${s.label}は使用済み。`,'status');return;}
 let tg=directTargets(ctx,actor,s,action.target);
 if(!tg.length){ctx.say(`${actor.name}：${s.label}の対象不在`,'status');return;}
 if(s.uses===1)actor.used.push(s.id);
 ctx.say(`${actor.name}｜${s.label}`,'action');ctx.metrics.skills[s.id]=(ctx.metrics.skills[s.id]||0)+1;
 if(s.type==='damage'){

   for(let h=0;h<(s.hits||1);h++){
    if(tgt.hp<=0)break;
    let bonus=(s.bonus_poison&&isStat(tgt,'poison')?s.bonus_poison:0)+(s.bonus_pdef_debuff&&tgt.buffs.some(x=>x.pct<0&&x.stats.includes('pdef'))?s.bonus_pdef_debuff:0);
    let kind=s.kind;if(actor.id==='H'&&s.id==='H.basic'&&ctx.gem==='tide')kind='magic';
    let dealt=damage(ctx,actor,tgt,kind,s.power,{element:s.elem,ignore:s.ignore||0,extra:bonus,aoe:s.scope==='enemies'});
    if(s.lifesteal){let healed=Math.floor(dealt*s.lifesteal);actor.hp=Math.min(actor.maxhp,actor.hp+healed)}
   }
  }
  if(s.self_buff_pdef)addBuff(actor,['pdef'],s.self_buff_pdef,3,s.id,ctx);
  if(s.debuff_stats)tg.forEach(t=>addBuff(t,s.debuff_stats,s.debuff_pct,s.debuff_duration,s.id,ctx));
 }else if(s.type==='buff'||s.type==='debuff'){
  tg.forEach(t=>addBuff(t,s.stats,s.pct,s.duration,s.id,ctx));
 }else if(s.type==='barrier'){
  tg.forEach(t=>{t.shields.push({value:s.value,left:s.duration});ctx.say(`${t.name}に障壁${s.value}`,'status')});
 }else if(s.type==='heal'){
  tg.forEach(t=>{const heal=Math.min(t.maxhp-t.hp,s.value);t.hp+=heal;ctx.say(`${t.name}のHPを${heal}回復`,'heal')});
 }else if(s.type==='status'){
  tg.forEach(t=>addStatus(t,s.status,s.duration,ctx));
 }else if(s.type==='interrupt'){
  tg.forEach(t=>{if(!t.statusImmune&&!isStat(t,'control_immune')){t.control=1;ctx.say(`${t.name}の次の行動を阻害`,'status')}});
 }else if(s.type==='taunt'){
  actor.taunt=s.duration;actor.justTaunted=true;ctx.say(`${actor.name}が攻撃を引き受ける`,'guard');
 }else if(s.type==='cover'||s.type==='cover_aoe'){
  if(s.type==='cover')actor.cover={target:action.target,left:s.duration,skipExpireOnce:true};
  else actor.aoe_cover={target:action.target,left:s.duration,skipExpireOnce:true};
  ctx.say(`${actor.name}が${byId(ctx.allies,action.target)?.name}を${s.type==='cover'?'単体':'全体攻撃'}から守る`,'guard');
 }else if(s.type==='immune_control'){
  tg.forEach(t=>addStatus(t,'control_immune',s.duration,ctx));
 }else if(s.type==='dispel'){
  tg.forEach(t=>{if(t.shields.length)t.shields=[];else t.buffs=t.buffs.filter(b=>b.pct<0);ctx.say(`${t.name}の強化を解除`,'status')});
 }else if(s.type==='cleanse'){
  for(const t of tg){
   let hasAilment=t.toxic_poison>0||t.statuses.some(q=>['poison','mark','vulnerable'].includes(q.kind))||t.buffs.some(b=>b.pct<0);
   t.statuses=t.statuses.filter(q=>!['poison','mark','vulnerable'].includes(q.kind));
   t.toxic_poison=0;t.buffs=t.buffs.filter(q=>q.pct>=0);
   ctx.say(`${t.name}を浄化${hasAilment?'！':'（解除対象なし）'}`,'heal');
   if(actor.id==='07'&&hasAilment){addBuff(t,['patk','matk'],.20,2,'07_boon',ctx);ctx.metrics.purification++;}

}
function commandArray(row,round){let cmd=row.script[Math.min(round-1,row.script.length-1)];
 if(typeof cmd==='string')return [[cmd]];
 if(!Array.isArray(cmd))return [['CHARGE']];
 if(Array.isArray(cmd[0]))return cmd;

}
function enemyAction(ctx,actor,row,round){
 ctx.actionCounterTaken.clear(); // one counter per independent enemy action
 for(const cmd of commandArray(row,round)){
  if(actor.hp<=0||!live(ctx.allies).length)break;
  const op=cmd[0];const choose=(who)=>{
    let arr=live(ctx.allies);if(!arr.length)return null;
    if(who==='lowest')return [...arr].sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp||a.id.localeCompare(b.id))[0];
    return arr.find(x=>x.id==='H')||arr[0];
  };

  else if(op==='GUARD'||op==='SACRIFICE'){ctx.say(`${actor.name}が護衛態勢`,'guard')}
  else if(op==='CHARGE'){ctx.say(`${actor.name}は力を溜めている…`,'warning')}
  else if(op==='POISON_ALL')live(ctx.allies).forEach(x=>addStatus(x,'poison',3,ctx));
  else if(op==='POISON12'){live(ctx.allies).forEach(x=>{x.toxic_poison=3;ctx.say(`${x.name}は猛毒を受けた`,'warning')})}
  else if(op==='DEBUFF_ALL')live(ctx.allies).forEach(x=>addBuff(x,[cmd[1]],cmd[2],3,actor.id,ctx));
  else if(op==='FIXED_AOE')live(ctx.allies).forEach(x=>{x.hp=Math.max(0,x.hp-cmd[1]);ctx.say(`${x.name}へ防御無視 ${cmd[1]}ダメージ`,'warning')});

  }else if(op==='DISPEL_DEBUFF')live(ctx.allies).forEach(x=>{x.buffs=x.buffs.filter(b=>b.pct<0);addBuff(x,['patk','matk'],-.20,3,actor.id,ctx)});

 }
}
function expire(ctx,u){
 // Poison ALWAYS applies after the target character's action opportunity (even if interrupted).
 if(u.hp>0&&isStat(u,'poison')){
  const loss=Math.min(u.hp,Math.max(1,Math.floor(u.maxhp*.06)));u.hp-=loss;ctx.metrics.poison+=loss;ctx.say(`${u.name}は行動後、毒で${loss}ダメージ`,'poison');
 }
 if(u.hp>0&&u.toxic_poison>0){const loss=Math.min(u.hp,Math.max(1,Math.floor(u.maxhp*.12)));u.hp-=loss;u.toxic_poison--;ctx.metrics.poison+=loss;ctx.say(`${u.name}は行動後、猛毒で${loss}ダメージ`,'poison');}

  u[name].forEach(x=>{if(x.skipExpireOnce){x.skipExpireOnce=false;}else x.left--;});
  u[name]=u[name].filter(x=>x.left>0&&(name!=='shields'||x.value>0));

function snapshot(allies,enemies,round){

function simulate({encounterId,roster,gem='balanced',gear={},plan}){

 const encounter=D().encounters.find(x=>x.id===encounterId);
 const allies=makeParty(roster,gem,gear),enemies=encounter.enemies.map(x=>unit(x,'enemy'));
 const ctx={allies,enemies,gem,encounterId,logs:[],round:0,currentActor:null,metrics:{cover:0,aoeCover:0,counter:0,poison:0,damage:0,reflection:0,purification:0,skills:{}},actionCounterTaken:new Set(),

  say:(message,type='info')=>ctx.logs.push({round:ctx.round,text:message,type})};

 for(let r=1;r<=5;r++){
  ctx.round=r;ctx.say(`―― 第${r}ラウンド ――`,'round');

  const order=live([...allies,...enemies]).sort((a,b)=>{
    const high=u=>u.side==='ally'&&['02.01','02.02','02.12'].includes(plan[r-1][u.id]?.skill)?1:0;
    return high(b)-high(a)||stats(b,'spd')-stats(a,'spd')||a.id.localeCompare(b.id);

   if(actor.hp<=0)continue;
   ctx.currentActor=actor.id;
   if(actor.control>0&&!isStat(actor,'control_immune')){

  remainingEnemyHP:enemies.reduce((a,u)=>a+u.hp,0),remainingPartyHP:allies.reduce((a,u)=>a+u.hp,0),
  engineVersion:'playable-browser-prototype-0.1',warning:'試作Pythonエンジンからの移植版。効果期限など完全な同値性は未検証'};

function autoPlan(roster,gem,encounter,style='mixed'){

 return `${header('敵図鑑・戦闘試験','物語に登場する敵だけでなく、17遭遇すべてを自由に試せる。EP-Bは殲滅勝利のみで、防衛ルート案は未実装。',chip('17遭遇','goldchip'))}
 <div class="actions" style="margin-bottom:20px">${[['all','すべて'],['story','物語に登場'],['challenge','高難度候補']].map(([k,v])=>`<button data-filter="${k}" class="btn tiny ${state.libraryFilter===k?'primary':'ghost'}">${v}</button>`).join('')}</div>
 <div class="selection-grid">${records.map(e=>`<article class="card panel"><div class="role-banner"><span class="eyebrow">${e.id}</span>${chip(e.enemies.length+'体')}</div><h3 class="section-title" style="font-size:20px;margin:12px 0 8px">${escape(encounterLine[e.id]||e.name)}</h3><p class="section-intro" style="min-height:55px">${escape(e.enemies.map(x=>x.name).join('・'))}</p><div class="actions" style="margin:12px 0 14px">${e.id==='E03'?chip('S9採用','mintchip'):e.id==='E04'?chip('C13採用','mintchip'):e.id==='EP_B'?chip('敵撃破のみ'):chip('既存試験敵')}</div><button class="btn block ghost" data-encounter="${e.id}">この敵に挑む →</button></article>`).join('')}</div>`;
}
function renderResult(){const res=state.result;if(!res)return `<div class="card panel">戦闘結果はまだありません。${btn('戦闘準備へ','go-battle','primary')}</div>`;
 const round=Math.min(state.round,res.states.length-1),snapshot=res.states[round];
 const units=(arr,enemy=false)=>arr.map(x=>`<div class="hp-line"><div class="hp-top"><span>${escape(x.name)}</span><span>${x.hp}/${x.maxhp}${x.poison?' ☠':''}${x.shields?' 🛡'+x.shields:''}</span></div><div class="hp-meter ${enemy?'enemy':''}"><span style="width:${Math.max(0,Math.round(x.hp/x.maxhp*100))}%"></span></div></div>`).join('');
 const logs=res.logs.filter(l=>state.logFilter==='all'||l.round===round).map(l=>`<div class="log-line ${l.type}">${escape(l.text)}</div>`).join('');
 const isStoryGate=['E01','E04','E03'].includes(res.encounterId);
 return `${header('戦闘結果','敵の固定行動と5ラウンドの予約を再現。ラウンドを選んでHP推移と戦闘ログを確認できる。',chip(res.encounterId))}
 <div class="result-banner ${res.won?'':'lost'}"><p class="eyebrow">${res.won?'VICTORY':'DEFEAT'}</p><h2>${res.won?'勝 利':'敗 北'}</h2><p>${res.won?'5ラウンド以内に敵を全滅させた。':'敵を全滅させられなかった。編成・装備・行動順を変更できる。'}</p></div>
 <div class="battle-stats"><div class="metric"><strong>${res.round} / 5</strong><span>終了ラウンド</span></div><div class="metric"><strong>${res.remainingPartyHP}</strong><span>味方残りHP</span></div><div class="metric"><strong>${res.remainingEnemyHP}</strong><span>敵残りHP</span></div><div class="metric"><strong>${res.metrics.counter}</strong><span>守護反撃回数</span></div></div>
 <div class="actions" style="margin-bottom:17px">${btn('同じ予約で再戦','rerun','ghost')}${btn('行動を組み直す','go-battle','ghost')}${res.won&&isStoryGate?btn('物語の続きを読む →','continue-story','primary'):btn('敵図鑑へ','go-library','primary')}</div>
 <div class="round-tabs">${res.states.map((x,i)=>`<button class="round-tab ${round===i?'active':''}" data-result-round="${i}">${i===0?'開始時':`第${x.round}R後`}</button>`).join('')}</div><div class="state-panes"><div class="card state-panel"><h3>味方HP</h3>${units(snapshot.allies)}</div><div class="card state-panel"><h3>敵HP</h3>${units(snapshot.enemies,true)}</div></div>
 <div class="section-head" style="margin-top:27px;margin-bottom:10px"><h2 class="section-title" style="font-size:21px">戦闘ログ</h2><div class="actions"><button class="btn tiny ${state.logFilter==='all'?'primary':'ghost'}" data-log-filter="all">すべて</button><button class="btn tiny ${state.logFilter==='round'?'primary':'ghost'}" data-log-filter="round">選択Rのみ</button></div></div>
 <div class="logs" id="combat-log" aria-label="戦闘ログ">${logs}</div><div class="notice" style="margin-top:17px">戦闘は試作Pythonモデルを参考にしたブラウザ移植版。イベントの順序・状態異常期間など、検証エンジンとの完全一致は今後の監査対象です。</div>`;
}
function renderAbout(){return `${header('この試作について','ゲーム全体を歩いて試すための叩き台。物語、キャラ名、グラフィックは仮。',chip('0.1.0 / OFFLINE READY','goldchip'))}
 <div class="card panel"><h3 class="section-title" style="font-size:22px">実装されているもの</h3><div class="info-grid" style="margin-top:13px"><div>${[['物語','港を舞台にした仮の短編・3戦'],['パーティ','主人公＋仲間3人（20通り）'],['装備','武器・防具・装飾、30種'],['技能','Lv1初期技能＋奥義・1戦1回'],['戦闘','5R事前予約、速度・優先度で行動'],['敵','17遭遇／③S9・④C13のみ新規採用']].map(([l,v])=>`<div class="info-row"><span class="muted">${l}</span><strong>${v}</strong></div>`).join('')}</div><div>${[['攻撃役','04 MATK / 06 PATK = 130（v11試験基準）'],['バフ','対象能力群が異なれば乗算（例1.9575倍）'],['防御先制','庇護・全体庇護・挑発＝優先度＋1'],['毒','対象が行動した後にダメージ'],['浄化','07成功時、PATK/MATK＋20%'],['EP-B','従来の撃破条件のみ・二経路案なし']].map(([l,v])=>`<div class="info-row"><span class="muted">${l}</span><strong>${v}</strong></div>`).join('')}</div></div></div>
 <div class="card panel" style="margin-top:15px"><h3 class="section-title" style="font-size:22px;margin-bottom:12px">差し替えと動作環境</h3><p class="section-intro">GitHub PagesなどのHTTPS静的ホスティング、またはindex.htmlを直接開いて遊べる。定刻処理は未実装で、テスト版は戦闘を即時実行する。外部ライブラリ・通信・アカウント不要。編成・装備・物語進捗はブラウザのlocalStorageに保存される。別端末との同期は未実装。</p><p class="section-intro">キャラは過去の別案を元にした属性・容姿メモを反映しているが、表示はCSSによる仮ビジュアル。正式な画像素材は未挿入。art.js のCHAR_ARTへ画像パスを設定すると差し替えできる。固有名もすべて仮名。</p><p class="section-intro">ブラウザ戦闘エンジンはPythonの実験用戦闘シミュレータを仕様参照した独立移植であり、Python試験結果と1件ずつ一致する保証はない。正式ゲーム実装の基盤とする前に差分テストが必要。</p><div class="actions" style="margin-top:21px">${btn('進捗と編成をJSONで保存','export-data','ghost')}${btn('はじめからやり直す','clear-data','danger')}</div></div>`;
}
function launchBattle(id){state.encounter=id;state.plan=null;state.planEncounter=null;state.round=0;goto('battle')}
function runBattle(){try{ensurePlan();let result=B.simulate({encounterId:state.encounter,roster:state.roster,gem:state.gem,gear:state.equipment,plan:state.plan});state.result=result;state.round=result.states.length-1;state.logFilter='all';if(result.won&&!state.completed.includes(state.encounter))state.completed.push(state.encounter);goto('result');}catch(err){toast(`戦闘を開始できない：${err.message}`)}}
function chooseStory(index){const choice=scenes[state.scene].choices[index];if(!choice)return;if(choice.flag)state.storyFlag=choice.flag;
 if(choice.resetStory){state.scene=0;goto('story')}
 else if(choice.page)goto(choice.page);
 else if(choice.battle)launchBattle(choice.battle);
 else if(typeof choice.next==='number'){state.scene=choice.next;goto('story')}
}
function setSkill(id,sid){const r=state.round;const s=B.skill(sid);const poolEnemies=ENC[state.encounter].enemies;
 for(let i=0;i<5;i++){if(i!==r&&state.plan[i][id].skill===sid&&s.uses===1)state.plan[i][id]={skill:id+'.basic',target:poolEnemies[0].id};}
 const mode=B.targetMode(s);let target=null;
 if(mode==='enemy'){const physical=s.kind==='physical';target=poolEnemies.find(e=>!e.immuneKinds?.includes(physical?'physical':'magic'))?.id||poolEnemies[0].id}
 else if(mode==='ally'){target=state.roster.find(x=>(s.type!=='cover'&&s.type!=='cover_aoe')||x!==id)||'H'}
 state.plan[r][id]={skill:sid,target};persist();render();}
function applyPreset(kind){for(const id of ['H',...allowedParty]){const ori=id==='H'?state.gem==='tide'?'magic':'physical':['02','06'].includes(id)?'physical':'magic';const ids=D.gearsByFamily[kind][ori];state.equipment[id]={W:ids.find(x=>x[0]==='W')||'',A:ids.find(x=>x[0]==='A')||'',X:ids.find(x=>x[0]==='X')||''}}persist();render();toast('装備方針を変更したよ')}
function saveFile(filename,contents){const b=new Blob([contents],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
MAIN.addEventListener('click',e=>{
 const storyButton=e.target.closest('[data-story-choice]');if(storyButton){chooseStory(+storyButton.dataset.storyChoice);return}
 const pick=e.target.closest('[data-pick]');if(pick){let id=pick.dataset.pick;if(state.roster.includes(id)){state.roster=state.roster.filter(x=>x!==id)}else if(state.roster.length<4){state.roster.push(id);state.roster=['H',...state.roster.filter(x=>x!=='H').sort()]}else{toast('仲間は3人までだよ');return}state.plan=null;persist();render();return}
 const gem=e.target.closest('[data-gem]');if(gem){state.gem=gem.dataset.gem;state.plan=null;persist();render();return}
 const gp=e.target.closest('[data-gear-preset]');if(gp){applyPreset(gp.dataset.gearPreset);return}
 const filter=e.target.closest('[data-filter]');if(filter){state.libraryFilter=filter.dataset.filter;render();return}
 const book=e.target.closest('[data-encounter]');if(book){launchBattle(book.dataset.encounter);return}
 const rt=e.target.closest('[data-round]');if(rt){state.round=+rt.dataset.round;render();return}
 const rr=e.target.closest('[data-result-round]');if(rr){state.round=+rr.dataset.resultRound;render();return}
 const lf=e.target.closest('[data-log-filter]');if(lf){state.logFilter=lf.dataset.logFilter;render();return}
 const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;
 if(act==='go-battle')goto('battle');else if(act==='go-party')goto('party');else if(act==='go-library')goto('library');else if(act==='run-battle'||act==='rerun')runBattle();
 else if(act==='auto-mixed'||act==='auto-attack'){state.plan=B.autoPlan(state.roster,state.gem,ENC[state.encounter],act==='auto-attack'?'attack':'mixed');state.planEncounter=state.encounter;state.round=0;persist();render();toast('5ラウンドの予約を作ったよ')}
 else if(act==='load-sample'){const sample=window.GAME_SAMPLES?.[state.encounter];if(sample){state.roster=[...sample.roster];state.gem=sample.gem;state.equipment={...state.equipment,...JSON.parse(JSON.stringify(sample.equipment))};state.plan=JSON.parse(JSON.stringify(sample.plan));state.planEncounter=state.encounter;state.round=0;persist();render();toast('勝利を確認した攻略例を読み込んだよ。自由に変更できる。')}}
 else if(act==='continue-story'){if(state.result?.encounterId==='E01'&&state.scene<3)state.scene=3;else if(state.result?.encounterId==='E04'&&state.scene<5)state.scene=5;else if(state.result?.encounterId==='E03')state.scene=7;goto('story')}
 else if(act==='export-data')saveFile('shiozakai-save.json',JSON.stringify({version:'0.1',saved:new Date().toISOString(),roster:state.roster,gem:state.gem,equipment:state.equipment,completed:state.completed,storyScene:state.scene},null,2));
 else if(act==='clear-data'){if(confirm('編成・装備・物語進捗を初期化する？')){localStorage.removeItem(FLAG);state=defaults();render()}}
});
MAIN.addEventListener('change',e=>{
 let v=e.target.value;if(e.target.matches('[data-select-encounter]')){launchBattle(v);return}
 if(e.target.matches('[data-equipment]')){const [id,slot]=e.target.dataset.equipment.split(':');state.equipment[id][slot]=v;persist();render();return}
 if(e.target.matches('[data-skill]')){setSkill(e.target.dataset.skill,v);return}
 if(e.target.matches('[data-target]')){state.plan[state.round][e.target.dataset.target].target=v;persist();return}
});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.nav)));
$('#reset-btn').addEventListener('click',()=>{if(confirm('進捗・編成・装備を初期化する？')){localStorage.removeItem(FLAG);state=defaults();render()}});
render();
window.GameAppDebug={getState:()=>state,story:scenes,render,launchBattle,runBattle};
})();

</script>
</body></html>
