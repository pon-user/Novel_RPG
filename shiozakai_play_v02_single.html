<style>

.app-shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;max-width:1650px;margin:auto}.sidebar{background:#111d2bcf;border-right:1px solid #ffffff19;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:32px 18px;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:0 11px 42px}.brand-mark{font-size:40px;color:var(--gold);text-shadow:0 0 30px #e6bd8050}.brand strong{display:block;letter-spacing:2px;font-family:"Yu Mincho",serif;font-size:19px;font-weight:600}.brand small{display:block;color:#8a9caa;font-size:8px;letter-spacing:1.7px;margin-top:5px}.nav{display:grid;gap:7px}.nav-link{border:1px solid transparent;text-align:left;display:flex;align-items:center;gap:14px;border-radius:10px;padding:15px 17px;color:#aabcc9;background:transparent;font-weight:600;transition:.15s}.nav-link span{font-size:20px;width:23px;text-align:center;color:#a5b9c7}.nav-link.active,.nav-link:hover{background:#31435680;color:#fff;border-color:#52657b78}.nav-link.active:before{content:"";height:20px;width:3px;border-radius:3px;background:var(--gold);position:absolute;left:18px}.nav-link.active{padding-left:22px}.sidebar-note{margin-top:auto;padding:20px 12px;border-top:1px solid #ffffff1e;color:#c0d0d6;line-height:1.9;font-size:12px}.dot{display:inline-block;width:8px;height:8px;background:#78ceb1;border-radius:50%;margin-right:6px;box-shadow:0 0 11px #86deb2}.subtle{color:#8398a8}.main-column{display:flex;flex-direction:column;min-width:0}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:26px clamp(24px,4vw,58px);border-bottom:1px solid #ffffff10;min-height:106px}.breadcrumb{display:grid;gap:6px}.breadcrumb span,.eyebrow{color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:10px;font-weight:800}.breadcrumb strong{font-family:"Yu Mincho",serif;font-size:19px;font-weight:500}.topbar-right{display:flex;gap:8px;align-items:center}.tiny-tag{font-size:10px;letter-spacing:.3px;bor .card{background:linear-gradient(150deg,#1c2a3bd9,#172231ed);border:1px solid #46566b65;border-radius:var(--radius);box-shadow:0 9px 30px #010a122e}.panel{padding:24px}.section-title{font-family:"Yu Mincho",serif;font-size:25px;font-weight:500;line-height:1.5}.section-intro{color:var(--muted);font-size:13px;line-height:1.9;margin-top:8px}.section-head{margin-bottom:22px;display:flex;align-items:end;justify-content:space-between;gap:16px}.divider{height:1px;background:#ffffff19;margin:16px 0}.muted{color:var(--muted)}.small{font-size:12px}.micro{font-size:10px}.gold{color:var(--gold)}.green{color:var(--mint)}.warn{color:var(--red)}.chip{display:inline-flex;align-items:center;gap:6px;background:#a1c0db17;border:1px solid #a4c2d035;padding:6px 10px;border-radius:999px;color:#bed0da;font-size:10px;font-weight:650}.chip.goldchip{color:var(--gold);background:#d9b07913;border-color:#ddbd8250}.chip.mintchip{color:var(--mint);background:#75d3c312;border-color:#75d3c350}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 19px;border-radius:9px;border:1px solid #71859a72;background:#27394d;color:#eff4f7;font-weight:700;letter-spacing:.3px;white-space:nowrap;transition:.15s;text-decoration:none}.btn:hover{filter:brightness(1.13);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#e3bc80,#cda66b);color:#172131;border-color:#e4bd83;box-shadow:0 5px 20px #cda66b25}.btn.ghost{background:transparent;color:#b9cad6}.btn.tiny{font-size:11px;padding:7px 10px}.btn.block{width:100%}.btn.danger{border-color:#cc81818e;color:#f1b3a6}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px}.field label{color:#bfcdd7;font-size:11px}.select{background:#111f2d;border:1px solid #53667b8c;color:#e6f0f4;padding:11px 12px;border-radius:8px;width:100%;min-width:0;appearance:auto}.select option{background:#142232;color:#ecf4f7}.notice{color:#b2c5d2;background:#263a4d8c;border:1px solid #5d728553;padding:12px 16px;border-radius:10px;line-height:1.7;font-size:12px}
/* novel */
.hero{position:relative;overflow:hidden;border:1px solid #829eb253;border-radius:20px;min-height:370px;background:radial-gradient(circle at 72% 32%,#c4b89f3d,transparent 14%),linear-gradient(145deg,#29445b 0%,#243d52 29%,#182c3e 58%,#131f2d 100%);box-shadow:var(--shadow);display:flex;align-items:flex-end}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(165deg,transparent 42%,#182e43 43%,transparent 44%,transparent 56%,#0e1d2d 57%),repeating-linear-gradient(178deg,#b1b7c408 0px,#b1b7c408 1px,transparent 3px,transparent 20px);opacity:.72}.hero:after{content:"";position:absolute;bottom:0;left:0;right:0;height:38%;background:linear-gradient(transparent,#0c1729e8)}.hero-ornament{position:absolute;right:9%;top:12%;font-size:170px;font-weight:100;color:#c3d6df24;font-family:serif;transform:rotate(8deg);line-height:1}.hero-content{position:relative;z-index:1;padding:42px 42px 35px;max-width:690px}.hero h1{font-weight:500;font-size:clamp(31px,5vw,53px);letter-spacing:5px;margin:10px 0 14px;line-height:1.35;text-shadow:0 6px 30px #0006}.hero p{color:#d5e0e9;line-height:2;font-size:13px;max-width:510px}.hero .actions{margin-top:24px}.story-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(245px,.8fr);gap:18px;margin-top:20px}.story-panel{padding:28px;min-height:242px}.story-text{font-family:"Yu Mincho",serif;font-size:17px;line-height:2.15;letter-spacing:.7px;white-space:pre-line;margin:16px 0 23px;color:#e5edf2}.story-voice{color:var(--gold);font-size:12px;letter-spacing:2px}.story-choices{display:grid;gap:9px}.story-choice{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 18px;border:1px solid #556a80a0;background:#24394e8c;color:#ecf2f7;border-radius:9px}.story-choice:hover{border-color:var(--gold);background:#344b62}.quest-item{display:flex;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff14}.quest-index{color:var(--gold);font-family:serif;font-si /* characters */
.party-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.character-card{background:#1a2b3b;border:1px solid #3a5166;border-radius:13px;padding:16px;position:relative;min-width:0;transition:.15s}.character-card.selected{border-color:#d7ae7b98;box-shadow:inset 0 0 0 1px #d7ae7b33}.character-card:hover{border-color:#809cae}.character-card .ch-meta{font-size:10px;color:#c9b28a;letter-spacing:.6px;margin:5px 0 9px}.character-card h3{font-family:"Yu Mincho",serif;font-weight:600;font-size:18px;margin-top:8px}.character-card p{font-size:11px;line-height:1.7;color:var(--muted);margin:7px 0}.character-card .pick{margin-top:12px;min-height:34px;width:100%}.portrait{height:146px;display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 26%,var(--character-haze),transparent 68%),linear-gradient(150deg,#34556a8c,#192f41 70%);border-radius:8px;border:1px solid #ffffff1c}.portrait .orb{height:86px;width:86px;border-radius:50%;background:linear-gradient(150deg,#fff9,#fff1);opacity:.17;position:absolute;top:18px;right:-18px;filter:blur(4px)}.portrait .sigil{font-family:serif;font-size:95px;position:absolute;color:var(--character-haze);opacity:.24;top:5px;left:0;line-height:1}.portrait .head{position:absolute;width:54px;height:65px;background:#ddc7b4;border-radius:45% 45% 48% 48%;top:37px;left:calc(50% - 27px);box-shadow:0 1px 6px #161c2555}.portrait .hair{position:absolute;z-index:2;width:70px;height:61px;border-radius:48% 48% 20% 30%;top:28px;left:calc(50% - 35px);background:var(--character-hair);clip-path:polygon(0 0,100% 0,100% 46%,82% 32%,70% 62%,55% 32%,35% 64%,25% 40%,0 70%)}.portrait .coat{position:absolute;bottom:-15px;width:115px;height:77px;border-radius:40% 40% 0 0;background:linear-gradient(100deg,var(--character-coat),#243545);box-shadow:0 -10px 0 -6px #f2e9dc2c}.portrait.hero-portrait .hair{background:#d6e3ef}.portrait.hero-portrait .coat{background:#365774}.portrait.bear .head{width:70px;height:69px;left:calc(50% - 35px);top:27px;background:#92735d;border-radius:45%}.portrait.bear .hair{width:84px;height:75px;top:17px;left:calc(50% - 42px);background:#80624f;clip-path:ellipse(49% 42%)}.portrait.bear .head:before,.portrait.bear .head:after{content:"";position:absolute;width:19px;height:19px;background:#97785c;border:5px solid #7b5f4b;top:-5px;border-radius:50%}.portrait.bear .head:before{left:-7px}.portrait.bear .head:after{right:-7px}.portrait.long-hair .hair{height:120px;clip-path:polygon(7% 0,93% 0,100% 98%,72% 98%,61% 35%,50% 16%,37% 34%,25% 98%,0 98%)}.portrait .portrait-placeholder{position:absolute;bottom:8px;right:8px;padding:3px 6px;border-radius:5px;background:#081725ad;font-size:9px;color:#c8d5df}.portrait img{width:100%;height:100%;object-fit:contain;position:absolute;z-index:4;background:#1a2c3d}.portrait img[hidden]{display:none}.role-banner{display:flex;align-items:center;justify-content:space-between;gap:10px}.role-banner strong{font-size:12px}.selection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.member-slot{padding:15px;border:1px solid #526b7d69;border-radius:13px;background:#1c2e40;display:grid;gap:8px}.member-head{display:flex;align-items:center;gap:11px}.member-head .portrait{width:77px;height:83px;flex-shrink:0}.member-head .portrait .head{transform:scale(.65);transform-origin:center top;top:25px}.member-head .portrait .hair{transform:scale(.7);transform-origin:center top;top:17px}.member-head .portrait .coat{transform:scale(.8);transform-origin:center bottom}.member-head h3{font-family:"Yu Mincho",serif;font-size:16px}.stat-line{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat-pill{border:1px solid #ffffff13;background:#0d1e2b85;border-radius:5px;padding:5px 7px;color:#afc3ce;font-size:10px}.stat-pill strong{display:block;color:#f0f2f6;font-size:12px}.equipment-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.equipment-r .battle-header{display:grid;grid-template-columns:1fr 1fr;gap:16px}.enemy-preview{display:grid;gap:9px;padding:16px;max-height:275px;overflow:auto}.enemy-mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid #ffffff19}.enemy-mini strong{font-size:12px}.enemy-mini small{color:#a9bcc7}.round-tabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 14px;padding-bottom:3px}.round-tab{background:#213145;color:#b6c6d0;border:1px solid #55697b;padding:13px 17px;border-radius:9px;flex:1;white-space:nowrap;min-width:64px}.round-tab.active{border-color:var(--gold);background:#3c3940;color:#efd5af}.plan-grid{display:grid;gap:11px}.plan-row{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(125px,.6fr);align-items:center;gap:12px;padding:12px 15px;border:1px solid #4c627693;border-radius:12px;background:#1c2e4090}.plan-character{display:flex;align-items:center;gap:10px}.plan-character .token{width:37px;height:37px;border-radius:9px;display:grid;place-items:center;background:#344659;border:1px solid #7384965e;color:var(--gold);font-size:17px}.plan-character span{font-size:11px;color:var(--muted)}.plan-character strong{display:block;font-size:13px;margin-top:3px}.skill-description{margin-top:9px;color:#9db2c2;font-size:11px;line-height:1.7}.battle-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:21px}

 if(modal.kind==='swap'){const from=state.roster[modal.index];inner=`<h2>${modal.index===0?'命珠を選ぶ':'仲間を入れ替える'}</h2><p class="section-intro">${modal.index===0?'命珠を変えると主人公の技能予約を通常攻撃へ初期化する。':'入れ替え時は装備3枠と技能予約5ラウンドを初期化する。'}</p><div class="modal-grid">${modal.index===0?Object.entries(GEMS).map(([k,name])=>`<button class="catalog-item" data-swap-gem="${k}"><span class="catalog-symbol">◇</span>${esc(name)}</button>`).join(''):ROSTER_IDS.map(id=>`<button class="catalog-item" data-swap-char="${id}" ${state.roster.includes(id)&&id!==from?'disabled':''}>${portrait(id)}<strong>${esc(cName(id))}</strong><small>${state.roster.includes(id)&&id!==from?'編成中':'入れ替える'}</small></button>`).join('')}</div>`}
 if(modal.kind==='equip'){const [id,slot]=[modal.id,modal.slot],items=Object.values(D.equipment).filter(x=>x.slot===slot);inner=`<h2>${esc(cName(id))} / ${SLOTS[slot]}</h2><p class="section-intro">装備を選択。装備を長押しすると図鑑で詳細を確認できます。</p><div class="modal-list"><button class="item-option" data-set-equip="${id}:${slot}:none">装備なし</button>${items.map(x=>`<button class="item-option" data-set-equip="${id}:${slot}:${x.id}" data-info-kind="equipment" data-info-id="${x.id}"><strong>${esc(x.name)}</strong><small>${Object.entries(x.stats).map(([k,v])=>`${STATS[k]}${v>=0?'+':''}${v}`).join(' / ')}</small></button>`).join('')}</div>`}
 if(modal.kind==='skill'){const [id,r]=[modal.id,modal.round],pool=B.skillOptions(id,state.gem);inner=`<h2>${esc(cName(id))} · 第${r+1}ラウンド</h2><p class="section-intro">技能だけを予約する。標的は戦闘時に自動決定。各固有技能は1戦1回。</p><div class="modal-list">${pool.map(s=>{const reserved=s.uses===1&&state.plan.some((row,i)=>i!==r&&row[id]?.skill===s.id);return `<button class="item-option" data-set-skill="${id}:${r}:${s.id}" ${reserved?'disabled':''}><strong>${esc(s.label)} ${reserved?'（別Rで使用済み）':''}</strong><small>${esc(skillDetail(s))}</small></button>`}).join('')}</div>`}
 if(modal.kind==='target-policy'){inner=`<h2>技能の自動ターゲット規則</h2><p>戦闘予約に敵・味方のターゲットIDは保存しません。各行動の実行時に、実際の生存者と状態から判定します。</p><div class="modal-list">${[['攻撃','攻撃が通る敵の中で、HP割合が最も低い相手。残HP→IDで同率決着。物理／魔法の完全無効は避ける。'],['全体攻撃・全体強化','生存する対象全員。'],['敵への弱体・妨害','有効な相手を優先したうえで物攻＋魔攻が最大の敵。'],['強化バフ','該当する攻撃能力が最も高い味方。'],['回復・防壁・庇護・全体庇護','HP割合が低い味方。庇護の対象は自分を除く。'],['浄化','解除できる異常・弱体のある味方を最優先。'],['強化解除','強化・障壁の多い敵を優先。']].map(([k,v])=>`<div class="detail-row"><strong>${k}</strong><small>${v}</small></div>`).join('')}</div><p class="quiet-note">HPや状態が変われば、そのラウンド内でも毎行動ごとに選び直します。敵が不明でも事前予約が可能です。今後の正式版では、技能ごとの優先規則をさらに細分化できます。</p>`}
 if(modal.kind==='confirm'){inner=`<h2>キャラクターを入れ替える？</h2><p class="section-intro">${esc(cName(state.roster[modal.index]))} → ${esc(cName(modal.newId))}</p><p>入れ替え先の装備3種と、5ラウンドの技能予約はすべて初期化されます。元のキャラの設定も装備なし・通常攻撃に戻します。</p><div class="actions" style="margin-top:20px"><button class="btn ghost" data-action="cancel-confirm">キャンセル</button><button class="btn primary" data-action="confirm-swap">入れ替える</button></div>`}
 OVER.innerHTML=`<div class="modal-screen"><section class="modal-panel" role="dialog" aria-modal="true"><div class="modal-top"><span class="eyebrow">SHIOZAKAI / ${modal.kind==='info'?'CODEX':'PREPARATION'}</span><button class="btn tiny ghost" data-action="close-modal">✕ 閉じる・編成に戻る</button></div><div class="modal-content">${inner}</div></section></div>`;
 const target=OVER.querySelector('.modal-panel');target?.focus();
}
function resetCharacter(id){state.equipment[id]={W:'',A:'',X:''};for(const r of state.plan)delete r[id]}
function setSkill(id,r,sid){const skill=B.skill(sid);if(!skill||!B.skillOptions(id,state.gem).some(s=>s.id===sid))return;if(skill.uses===1&&state.plan.some((row,i)=>i!==r&&row[id]?.skill===sid)){notify('同じ固有技能は1戦1回だよ');return}state.plan[r][id]={skill:sid};save();closeModal();render()}
function prepFromPreset(p){const roster=p.roster?.length===4?p.roster:state.roster;state.roster=cp(roster);state.gem=p.gem||'balanced';state.equipment={...defaultEquip(),...cp(p.equipment)};state.plan=(p.plan?.length===5?p.plan:basic(roster)).map(row=>Object.fromEntries(roster.map(id=>[id,{skill:row[id]?.skill||id+'.basic'}])));save();render();notify('編成プリセットを読み込んだよ')}
function choose(v){state.pending=v==='hold'?null:v;save();render()}
function sceneInfo(choice){return choice==='side'?SIDE:MISSIONS[Math.min(state.stage,2)]}
function resolve(choice=state.pending,kind='story',testId=null){if(!choice&&kind==='story'){notify('次の行動が未選択です');return}if(choice==='hold'){notify('更新を保留したよ');return}if(kind==='story'&&choice==='main'&&state.stage>=3){notify('本編は終了しているよ');return}
 const mission=kind==='practice'?{...SIDE,id:testId,head:LOCATION[testId],intro:'追憶の戦闘が再現された。',win:'シミュレーションは成功した。'}:sceneInfo(choice);
 const snapshot={roster:cp(state.roster),gem:state.gem,equipment:cp(state.equipment),plan:cp(state.plan)};
 try{const result=B.simulate({encounterId:mission.id,roster:state.roster,gem:state.gem,gear:state.equipment,plan:state.plan});
 const after=result.won?mission.win:'「よし、シミュレーション完了！」――目を開くと、あなたは出発前の部屋にいた。危険を予測する命珠の幻視だったのだ。同じ選択肢からもう一度挑める。';
 const record={kind,label:mission.head,encounterId:mission.id,time:new Date().toISOString(),intro:mission.intro,after,result,enemies:E[mission.id].enemies.map(u=>({id:u.id,name:u.name})),...snapshot};
 state.history.push(record);
 const seen=state.seen[mission.id]||{units:record.enemies,actions:[]};seen.units=record.enemies;
 for(const a of result.observed||[]){if(!seen.actions.some(x=>x.enemyId===a.enemyId&&x.round===a.round&&x.opcode===a.opcode))seen.actions.push(a)}
 state.seen[mission.id]=seen;
 if(kind==='story'&&result.won&&choice==='main')state.stage++;
 if(kind==='story'&&result.won&&choice==='side')state.sideDone++;
 state.pending=null;state.logExpanded=true;save();closeModal();goto(kind==='practice'?'recall':'story');
 if(kind==='story')setTimeout(()=>document.querySelector('.chronicle')?.scrollIntoView({behavior:'smooth',block:'start'}),100);
 }catch(e){notify(`戦闘を開始できない：${e.message}`);console.error(e)}
}
function exportSave(){const text=JSON.stringify(state,null,2),blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shiozakai-save-v02.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function perform(action){switch(action){case'target-policy':openModal({kind:'target-policy'});break;case'go-party':goto('party');break;case'close-modal':case'cancel-confirm':closeModal();break;case'confirm-swap':{if(!modal||modal.kind!=='confirm')return;const from=state.roster[modal.index],to=modal.newId;resetCharacter(from);resetCharacter(to);state.roster[modal.index]=to;for(const r of state.plan)r[to]={skill:to+'.basic'};save();closeModal();render();notify('編成を変更し、装備と技能を初期化したよ');break}
 case'toggle-log':state.logExpanded=!state.logExpanded;save();render();break;case'clear-choice':state.pending=null;save();render();break;case'resolve-now':resolve();break;case'auto-mixed':case'auto-attack':state.plan=B.autoPlan(state.roster,state.gem,null,action==='auto-attack'?'attack':'mixed');save();render();notify('5ラウンドの予約を作ったよ');break;case'reset-skills':state.plan=basic(state.roster);save();render();break;case'restart-story':if(confirm('物語の進行を最初に戻す？（図鑑と過去の記録は残します）')){state.stage=0;state.pending=null;save();render()}break;case'export':exportSave();break;case'wipe':if(confirm('全セーブデータ（編成・物語・図鑑・履歴）を初期化しますか？')){localStorage.removeItem(SAVE);state=initial();closeModal();render()}break;
 }}
function handleClick(e){if(blockClick){e.preventDefault();e.stopPropagation();blockClick=false;return}
 const t=e.target.closest('button');if(!t)return;
 const d=t.dataset;
 if(d.action){perform(d.action);return}
 if(d.nav){closeModal();goto(d.nav);return}
 if(d.choice){choose(d.choice);return}
 if(d.editMember!==undefined){openModal({kind:'swap',index:+d.editMember});return}
 if(d.editEquipment){const [id,slot]=d.editEquipment.split(':');openModal({kind:'equip',id,slot});return}
 if(d.editSkill){const [id,round]=d.editSkill.split(':');openModal({kind:'skill',id,round:+round});return}
 if(d.setEquip){const [id,slot,item]=d.setEquip.split(':');state.equipment[id][slot]=item==='none'?'':item;save();closeModal();render();return}
 if(d.setSkill){const [id,round,sid]=d.setSkill.split(':');setSkill(id,+round,sid);return}
 if(d.swapChar){const id=d.swapChar;if(state.roster.includes(id))return;openModal({kind:'confirm',index:modal.index,newId:id});return}
 if(d.swapGem){if(d.swapGem!==state.gem){state.gem=d.swapGem;for(const r of state.plan)r.H={skill:'H.basic'};save();notify('命珠を変更して主人公の技能予約を初期化したよ')}closeModal();render();return}
 if(d.presetSave!==undefined){const i=+d.presetSave;state.presets[i]={name:`編成 ${i+1}`,roster:cp(state.roster),gem:state.gem,equipment:cp(state.equipment),plan:cp(state.plan)};save();render();notify(`編成${i+1}を保存したよ`);return}
 if(d.presetLoad!==undefined){const p=state.presets[+d.presetLoad];if(p)prepFromPreset(p);return}
 if(d.lib){state.lib=d.lib;save();render();return}
 if(d.detail){const [type,id]=d.detail.split(':');openModal({kind:'info',type,id});return}
 if(d.practice){resolve(null,'practice',d.practice);return}
}
function longPressEvent(e){const t=e.target.closest('[data-info-kind]');if(!t)return;
 if(e.type==='pointerdown'){
  if(e.button!==0&&e.pointerType==='mouse')return;
  holdStart={x:e.clientX,y:e.clientY,target:t};clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{blockClick=true;openModal({kind:'info',type:t.dataset.infoKind,id:t.dataset.infoId,slot:t.dataset.infoSlot||''})},550);
 }else if(e.type==='pointermove'){
  if(holdStart&&(Math.abs(e.clientX-holdStart.x)>12||Math.abs(e.clientY-holdStart.y)>12)){clearTimeout(holdTimer);holdStart=null}
 }else{clearTimeout(holdTimer);holdStart=null}
}
document.body.addEventListener('click',handleClick);
for(const evt of ['pointerdown','pointerup','pointercancel','pointermove','pointerleave'])document.body.addEventListener(evt,longPressEvent);
document.body.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-info-kind]');if(el){e.preventDefault();clearTimeout(holdTimer);openModal({kind:'info',type:el.dataset.infoKind,id:el.dataset.infoId,slot:el.dataset.infoSlot||''})}});
OVER.addEventListener('click',e=>{if(e.target===OVER||e.target.classList.contains('modal-screen'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#reset-btn').addEventListener('click',()=>perform('wipe'));
render();window.GameAppDebug={getState:()=>state,render,resolve,openModal,closeModal,save};
})();

</script>
</body></html>
